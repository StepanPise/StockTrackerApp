spring.application.name=stocktrack

server.port=8080

spring.datasource.url=jdbc:h2:mem:stocktrack_db
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

finnhub.api.profile.url=https://finnhub.io/api/v1/stock/profile2
finnhub.api.url=https://finnhub.io/api/v1/quote
#FINNHUB_API_KEY is an environment variable (to hide personal API key)
finnhub.api.key=${FINNHUB_API_KEY}