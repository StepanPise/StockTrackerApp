spring.application.name=stocktrack

server.port=8080

spring.datasource.url=jdbc:h2:mem:stocktrack_db
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

finnhub.api.profile.url=https://finnhub.io/api/v1/stock/profile2
finnhub.api.url=https://finnhub.io/api/v1/quote

#ENVIROMENT VARIABLES
finnhub.api.key=${FINNHUB_API_KEY}
#hex key generated with "openssl rand -hex 32"
application.security.jwt.secret-key=${JWT_SECRET_KEY}